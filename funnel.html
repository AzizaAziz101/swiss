<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Projekt Starten | Metallbau Franzmann</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .step-transition { transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
</head>
<body class="bg-[#f8f9fa] text-slate-900" x-data="{ step: 1, type: '' }">

<nav class="fixed top-0 inset-x-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-7xl mx-auto flex justify-between items-center px-8 py-6">
        <a href="index.html" class="font-black text-xl tracking-tighter uppercase">Franzmann<span class="text-blue-700">.</span></a>
        <a href="index.html" class="text-[10px] font-bold uppercase tracking-widest text-slate-400 hover:text-slate-900 transition">← Zurück</a>
    </div>
</nav>

<main class="pt-40 pb-24 min-h-screen flex flex-col items-center">
    <div class="w-full max-w-3xl px-8">
        
        <div class="w-full bg-slate-200 h-1 mb-16 overflow-hidden">
            <div class="bg-blue-700 h-full step-transition" :style="`width: ${(step/3)*100}%`"></div >
        </div>

        <div x-show="step === 1" x-transition class="step-transition">
            <p class="text-blue-600 font-bold tracking-[0.3em] text-[10px] uppercase mb-4">Schritt 01 — Klassifizierung</p>
            <h1 class="text-5xl font-black uppercase tracking-tighter italic mb-12">Welches Ziel <br>verfolgen Sie?</h1>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <button @click="type = 'Architektur'; step = 2" class="group border-2 border-slate-900 p-8 text-left hover:bg-slate-900 hover:text-white transition">
                    <span class="block text-[10px] font-black mb-2 opacity-50 uppercase tracking-widest">01</span>
                    <span class="text-xl font-black uppercase">Architektonischer Stahlbau</span>
                    <span class="block mt-4 text-sm opacity-70">Treppen, Balkone, Design-Elemente.</span>
                </button>
                <button @click="type = 'Industrie'; step = 2" class="group border-2 border-slate-900 p-8 text-left hover:bg-slate-900 hover:text-white transition">
                    <span class="block text-[10px] font-black mb-2 opacity-50 uppercase tracking-widest">02</span>
                    <span class="text-xl font-black uppercase">Industrielle Lösung</span>
                    <span class="block mt-4 text-sm opacity-70">Hallenbau, Podeste, Sonderkonstruktion.</span>
                </button>
            </div>
        </div>

        <div x-show="step === 2" x-transition class="step-transition" x-cloak>
            <p class="text-blue-600 font-bold tracking-[0.3em] text-[10px] uppercase mb-4">Schritt 02 — Spezifikationen</p>
            <h2 class="text-5xl font-black uppercase tracking-tighter italic mb-12" x-text="type === 'Architektur' ? 'Design & Maße' : 'Anforderungen'"></h2>
            
            <div class="space-y-8">
                <div>
                    <label class="block text-[11px] font-black uppercase tracking-widest mb-3">Grobe Projektbeschreibung</label>
                    <textarea rows="4" class="w-full bg-white border-2 border-slate-200 p-4 focus:border-blue-700 outline-none transition" placeholder="Beschreiben Sie kurz die Dimensionen oder Besonderheiten..."></textarea>
                </div>
                
                <div class="flex items-center gap-4">
                    <button @click="step = 1" class="text-[11px] font-bold uppercase tracking-widest px-8 py-4 border-2 border-slate-200 hover:border-slate-400 transition">Zurück</button>
                    <button @click="step = 3" class="flex-1 bg-blue-700 text-white text-[11px] font-black uppercase tracking-widest py-4 hover:bg-blue-800 transition">Weiter zur Deadline</button>
                </div>
            </div>
        </div>

        <div x-show="step === 3" x-transition class="step-transition" x-cloak>
            <p class="text-blue-600 font-bold tracking-[0.3em] text-[10px] uppercase mb-4">Schritt 03 — Finalisierung</p>
            <h2 class="text-5xl font-black uppercase tracking-tighter italic mb-12">Kontakt & <br>Zeitplan.</h2>
            
            <form class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[11px] font-black uppercase tracking-widest mb-3">Name</label>
                        <input type="text" class="w-full bg-white border-2 border-slate-200 p-4 focus:border-blue-700 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-[11px] font-black uppercase tracking-widest mb-3">E-Mail</label>
                        <input type="email" class="w-full bg-white border-2 border-slate-200 p-4 focus:border-blue-700 outline-none transition">
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] font-black uppercase tracking-widest mb-3">Gewünschter Fertigstellungstermin</label>
                    <input type="date" class="w-full bg-white border-2 border-slate-200 p-4 focus:border-blue-700 outline-none transition">
                </div>
                
                <div class="pt-8 flex items-center gap-4">
                    <button type="button" @click="step = 2" class="text-[11px] font-bold uppercase tracking-widest px-8 py-4 border-2 border-slate-200 hover:border-slate-400 transition">Zurück</button>
                    <button type="submit" class="flex-1 bg-slate-900 text-white text-[11px] font-black uppercase tracking-widest py-4 hover:bg-blue-700 transition">ANFRAGE ABSCHICKEN</button>
                </div>
            </form>
        </div>

    </div>
</main>

<footer class="max-w-7xl mx-auto px-8 py-12 border-t border-slate-200">
    <p class="text-[9px] font-bold uppercase tracking-[0.3em] text-slate-400 text-center">Datenübertragung erfolgt verschlüsselt nach Industriestandard.</p>
</footer>

<style>[x-cloak] { display: none !important; }</style>

</body>
</html>
